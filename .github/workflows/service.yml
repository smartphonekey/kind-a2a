# SPDX-License-Identifier: AGPL-3.0-only
name: Durable A2A Service
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  service:
    # The org's self-hosted runner scale set (ARC on the Hetzner node), so CI
    # does not depend on GitHub-hosted minutes. Its unprivileged image has no
    # root, no C compiler and no xz.
    runs-on: hetzner-b2c
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # go test -race needs cgo; the ARC runner image has no root or C compiler.
      - name: Install a C compiler for go test -race
        shell: bash
        env:
          ZIG_VERSION: 0.14.1
          ZIG_SHA256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
        run: |
          if ! command -v gcc >/dev/null; then
            curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
            echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/zig"
            # No xz binary in the runner image; Python's lzma decompresses.
            python3 -c 'import lzma, shutil, sys; shutil.copyfileobj(lzma.open(sys.argv[1]), sys.stdout.buffer)' "$RUNNER_TEMP/zig.tar.xz" \
              | tar -x -C "$RUNNER_TEMP/zig" --strip-components=1
            echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
            echo "CC=zig cc" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run docs:check
      - run: npm run test:code-map:go
      - run: node --test --test-concurrency=2 dist/*.test.js tooling/code-map/*.test.mjs
      - run: node --test scripts/release-lock.test.mjs scripts/publish-service-image.test.mjs
      # Model-free checks only. No credentials, cluster access, deployment or provider calls.
