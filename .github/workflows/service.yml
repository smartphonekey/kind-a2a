# SPDX-License-Identifier: AGPL-3.0-only
name: Durable A2A Service
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run docs:check
      - run: npm run test:code-map:go
      - run: node --test --test-concurrency=2 dist/*.test.js tooling/code-map/*.test.mjs
      # Model-free checks only. No credentials, cluster access, deployment or provider calls.
