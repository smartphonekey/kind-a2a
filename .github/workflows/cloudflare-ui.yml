# SPDX-License-Identifier: AGPL-3.0-only
name: Cloudflare UI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-ui:
    # The org's self-hosted runner scale set (ARC on the Hetzner node).
    # Unprivileged image: no root/apt, so Playwright skips --with-deps.
    runs-on: hetzner-b2c
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      # No cloud credentials, live state, deployment runners or provider calls.
      - run: npm ci --ignore-scripts
      - run: npm --prefix web ci --ignore-scripts
      - run: npm run build
      - run: node --test dist/cloudflare-access.test.js dist/service-browser.test.js scripts/cloudflare-manifests.test.mjs scripts/k8s-manifests.test.mjs
      - run: terraform -chdir=infra/cloudflare fmt -check -recursive
      - run: terraform -chdir=infra/cloudflare init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/cloudflare validate
      - run: terraform -chdir=infra/cloudflare test -no-color
      # --with-deps needs apt/sudo; the ARC image is unprivileged. Browser
      # install alone matches WEB.md; shared libs come from the runner image.
      - run: npm exec --prefix web -- playwright install chromium
      - run: npm run test:web
