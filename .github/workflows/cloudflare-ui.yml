# SPDX-License-Identifier: AGPL-3.0-only
name: Cloudflare UI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # No cloud credentials, live state, deployment runners or provider calls.
      - run: npm ci --ignore-scripts
      - run: npm --prefix web ci --ignore-scripts
      - run: npm run build
      - run: node --test dist/cloudflare-access.test.js dist/service-browser.test.js scripts/cloudflare-manifests.test.mjs scripts/k8s-manifests.test.mjs
      - run: npm exec --prefix web -- playwright install --with-deps chromium
      - run: npm run test:web
