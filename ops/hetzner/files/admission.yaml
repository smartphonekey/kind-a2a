apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: restricted
        enforce-version: v1.35
        audit: restricted
        audit-version: v1.35
        warn: restricted
        warn-version: v1.35
      exemptions:
        usernames: []
        runtimeClasses: []
        # CNI/storage bootstrap belongs here. Agent namespaces are not exempt.
        namespaces: [kube-system]
